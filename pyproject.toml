[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiora"
version = "2.1.0"
description = "lumiora.web — open HTML layouts as real desktop apps. Frameless, per-pixel-transparent WebView2 windows (DirectComposition), pure Python stdlib, with a browser fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lumiora" }]
keywords = ["webview", "desktop", "gui", "windows", "webview2", "html", "frameless", "lumiora"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[tool.setuptools.packages.find]
include = ["lumiora*"]
